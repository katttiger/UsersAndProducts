<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
</head>

<body>
<h1>Users</h1>
<p>Note: these users are completely made up and do not exist.</p>



<ul th:each="user : ${users}">
    <li th:text="${user.getId()}"></li>
    <li th:text="${user.getUsername()}"></li>
    <li th:text="${user.getPassword()}"></li>
    <li th:text="${user.getEmail()}"></li>
</ul>

</body>
</html>
